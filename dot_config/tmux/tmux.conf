# Basic settings
set -g prefix ^A
set -g default-terminal "screen-256color"

set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
setw -g mode-keys vi             # vi keybinds for the most part
set -g status-keys emacs         # but these are better, even for vi users
set -g display-time 4000         # Increase tmux messages display duration from 750ms to 4s
set -g status-interval 5         # Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g focus-events on           # Focus events enabled for terminals that support them
setw -g aggressive-resize on     # Super useful when using "grouped sessions" and multi-monitor setup
setw -g mouse on


# Binds
bind-key C new-window -c "#{pane_current_path}" \; display-message "New window opened in current path!"
bind-key S attach-session -c "#{pane_current_path}" \; display-message "Session path updated!"
bind-key m choose-window -F "#{window_index}: #{window_name}" "join-pane -h -t %%"
bind-key M choose-window -F "#{window_index}: #{window_name}" "join-pane -v -t %%"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind C-p previous-window
bind C-n next-window

bind-key o run-shell "${HOME}/.config/tmux/switch.sh"


# Plugins
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

run '~/.tmux/plugins/tpm/tpm'


# Theme
# Status bar position
set-option -g status-position top

# Status bar colors (works across color schemes)
set-option -g status-style bg=colour235,fg=colour250

# Left side: session name
set-option -g status-left-length 40
set-option -g status-left "#[fg=colour250] #S #[bg=colour235] "

# Right side: date and time
set-option -g status-right-length 100
set-option -g status-right "#[fg=colour250] #H #[fg=colour240]│#[fg=colour250] %a %b %d #[fg=colour240]│#[fg=colour250] %I:%M %p %Z"

# Window status format
set-option -g window-status-format "#[fg=colour244] #I:#W "
set-option -g window-status-current-format "#[bg=colour240,fg=colour255,bold] #I:#W #[bg=colour235]"

# Window separator
set-option -g window-status-separator ""

# Center the window list
set-option -g status-justify left
