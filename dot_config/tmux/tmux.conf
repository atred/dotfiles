# Basic settings
unbind C-b
unbind l
set -g prefix C-a
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
setw -g mode-keys vi             # vi keybinds for the most part
set -g status-keys emacs         # but these are better, even for vi users
set -g display-time 4000         # Increase tmux messages display duration from 750ms to 4s
set -g status-interval 5         # Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g focus-events on           # Focus events enabled for terminals that support them
setw -g aggressive-resize on     # Super useful when using "grouped sessions" and multi-monitor setup
setw -g mouse on
# Fix ssh clipboard
set -s set-clipboard on
set -g default-terminal "tmux-256color" # inherit lots of settings from term info
set -as terminal-features ',xterm*:clipboard:RGB' # fix OSC 52 clipboard and truecolor
set -as terminal-overrides ',xterm*:sitm=\E[3m:ritm=\E[23m' # fix italics


# Binds
bind C new-window -c "#{pane_current_path}" \; display-message "New window opened in current path!"
bind S attach-session -c "#{pane_current_path}" \; display-message "Session path updated!"
bind m choose-window -F "#{window_index}: #{window_name}" "join-pane -h -t %%"
bind M choose-window -F "#{window_index}: #{window_name}" "join-pane -v -t %%"
bind r source-file ~/.config/tmux/tmux.conf
bind o run-shell "${HOME}/.config/tmux/switch.sh"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind C-p previous-window
bind C-n next-window


# Theme

# Color/symbol definitions
%hidden ACCENT="blue"
%hidden PREFIX_ACCENT="cyan"
%hidden COPY_ACCENT="yellow"
%hidden ALERT="red"
%hidden MUTED="brightblack"
%hidden BAR="default"
%hidden SUBTLE="black"
%hidden RARROW="\ue0b0"
%hidden RTHIN="\ue0b1"
%hidden LARROW="\ue0b2"
%hidden LTHIN="\ue0b3"

# Dynamic mode colors
%hidden MODE="#{?client_prefix,$PREFIX_ACCENT,#{?pane_in_mode,$COPY_ACCENT,$ACCENT}}"

set  -g status on
set  -g status-justify left
set  -g status-style "bg=$BAR,fg=default"
set  -g message-style "bg=$BAR,fg=$ACCENT"
set  -g message-command-style "bg=$BAR,fg=$PREFIX_ACCENT"
set  -g pane-border-style "fg=$MUTED"
set  -g pane-active-border-style "fg=default"
set  -g display-panes-colour "$MUTED"
set  -g display-panes-active-colour "$ACCENT"
setw -g clock-mode-colour "$ACCENT"

set -g status-left-style none
set -g status-left-length 80
set -g status-left "#[fg=$MODE,bg=$SUBTLE,bold] #S #[default,fg=$SUBTLE,bg=$BAR]$RARROW"
set -g status-right-style none
set -g status-right-length 80
set -g status-right "%Y-%m-%d #[fg=$MUTED]$LTHIN#[default] %H:%M #[fg=$SUBTLE,bg=$BAR]$LARROW#[fg=$MODE,bg=$SUBTLE,bold] #h "

setw -g window-status-separator ""
setw -g window-status-style default
setw -g window-status-current-style default
setw -g window-status-bell-style "fg=$ALERT,bold"
setw -g window-status-activity-style "fg=$ALERT"

setw -g window-status-current-format "#[fg=$MODE,bg=$BAR,reverse]$RARROW#[bold] #I $RTHIN #W#{?window_zoomed_flag, [Z],} #[default,fg=$MODE,bg=$BAR]$RARROW"
setw -g window-status-format " #I #W#{?window_zoomed_flag, [Z],} #{?window_end_flag,,#{?#{==:#{e|+:#{window_index},1},#{active_window_index}},,#[fg=$MUTED]$RTHIN}}"


# Plugins
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

run '~/.tmux/plugins/tpm/tpm'
